# DeliveryHub — orquestração para hospedar no domínio
services:
  deliveryhub:
    build: .
    container_name: deliveryhub
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
    environment:
      NODE_ENV: production
      # Banco persistente no volume
      DATABASE_URL: file:/app/data/deliveryhub.db
      AUTH_SECRET: ${AUTH_SECRET:?Defina AUTH_SECRET no .env}
      AUTH_URL: ${AUTH_URL:?Defina AUTH_URL com o domínio HTTPS}
      PORT: 3000
      HOSTNAME: 0.0.0.0
      SEED_ON_BOOT: ${SEED_ON_BOOT:-false}
    volumes:
      - deliveryhub_data:/app/data
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 40s

volumes:
  deliveryhub_data:
